# Build the reference and publish it to GitHub Pages.
#
# The site at https://scattercode.github.io/sillybos/ is the README followed
# by the API and command line reference, generated by Sphinx from docs/ and
# the package's docstrings (docs/conf.py). Every push to main builds it and
# deploys it with the official Pages flow (upload-pages-artifact, then
# deploy-pages from a job of its own): no gh-pages branch, nothing committed.
# A pull request runs the build alone, with warnings as errors, so a
# docstring that renders badly fails the review rather than main.
#
# Publishing needs the repository's Pages source set to "GitHub Actions"
# (Settings > Pages > Build and deployment), once, by hand. Until it is, the
# deploy job fails and says so; the build job reports regardless.
#
# The version in the page title comes from hatch-vcs. A merge that cuts no
# release (docs, ci, chore) therefore publishes as X.Y.Z.devN until the
# release commit for the next one lands, which is the honest reading of
# main at that moment; docs/conf.py says why the .devN is kept.
name: Docs

on:
  push:
    branches: [main]
  # No path filter on pull_request: a required check that is filtered out
  # never starts, so never reports, and leaves the pull request blocked.
  pull_request:
  workflow_dispatch:

# Granted per job below, not here: only the deploy job needs more than read.
permissions: {}

# Two regimes in one expression. Deploying runs share one serialised group
# with no cancellation, so a deploy is never killed mid-flight. Pull-request
# builds deploy nothing and get a per-ref group with cancellation, so a
# review-fix push stops the superseded build instead of paying for it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from `git describe --tags`, and
          # the page title carries it. A shallow clone has no tags
          # reachable and the site would call itself 0.1.dev1.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package with the docs extra
        run: pip install -e '.[docs]'

      # -W makes every warning a failure; --keep-going reports them all
      # rather than stopping at the first.
      - name: Build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # The artifact is what deploy-pages publishes. actions/configure-pages
      # is left out on purpose: it only sets outputs for static site
      # generators that need the site's base path, which Sphinx does not,
      # and it would need Pages permissions on a job that otherwise reads.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
